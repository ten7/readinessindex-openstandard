# The permanent crosswalk from Index 11 test IDs to Index 12 test IDs.
#
# An Index 11 ID names a dimension that no longer exists, and a stored result, a
# bookmarked report, an exported backlog and somebody's ticket all quote it. So an
# old ID never stops resolving: each maps here to what it became, scored target
# first. An empty list is a retired test and keeps its row, so "what happened to
# AIR-1.5" has an answer. A new ID is never reused for something else.
#
# Where several old tests became one, the first is the one whose logic the new test
# inherits and the others are folded into it.

v11_to_v12:
  AIR-1.1: [RCH-1, PST-1]
  AIR-1.2: [RCH-2]
