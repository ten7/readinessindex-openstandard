# The AI Readiness Index: test registry
#
# Mirrors AI-READINESS-INDEX.md (Index 12). The document is the source of truth; the
# tests in tests/ parse its appendix table and fail if this file drifts from it. A weight
# is never changed here without a major version bump.
#
# presets: which reduced runs a test belongs to. `quick` is the single-page scan: the
# tests that can be answered from one page and the site's front-door files. A preset
# changes which tests run, never how any of them is scored.
#
# License: CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/), see LICENSE.
# Scanners that read this file are separate software and are not part of the standard.

index_version: "12.1"

# The day this version took effect. Every result carries both, so an
# old report cannot silently start meaning something new when the
# Index changes underneath it.
index_date: "2026-10-21"

# Four scored categories. Posture, Extras and Measurement are reported beside
# them and never scored: a test with a `tier` of posture, extras or measurement.
dimensions:
  - id: 1
    name: "Reach"
    weight: 25
  - id: 2
    name: "Read"
    weight: 35
  - id: 3
    name: "Understand"
    weight: 25
  - id: 4
    name: "Act"
    weight: 15



