name: Correct a citation or a sentence
description: A wrong or broken source, a typo, an unclear question.
title: "Correction: "
labels: ["correction"]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: The test ID or the section, for example RCH-1.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what should it say?
    validations:
      required: true
